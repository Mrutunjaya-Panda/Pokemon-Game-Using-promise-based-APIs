<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokemon Game using Promise based Api Fetch</title>
    <link rel="stylesheet" href="pokemon.css">
  </head>
  <body>
    <div id="header">
      <h1>Pokemon Game</h1>
    </div>
    <div style="display: block">
      <button id="fight">Fight</button>
    </div>
    <div id="container">
      <div id="player1">
        <div id="card_header">
          <span id="p1_name"></span>
          <span id="p1_score"></span>
        </div>
        <div id="card1">
          <div id="img"></div>
          <span id="name"></span>
          <span id="experience"></span>
          <ul id="abilities">
            Abilities
          </ul>
        </div>
      </div>
      <div id="player2">
        <div id="card_header">
          <span id="p2_name"></span>
          <span id="p2_score"></span>
        </div>
        <div id="card2">
          <div id="img"></div>
          <span id="name"></span>
          <span id="experience"></span>
          <ul id="abilities">
            Abilities
          </ul>
        </div>
      </div>
    </div>
    <script src="pokemon.js"></script>
  </body>
</html>
